name: Keep Alive Supabase & Render

on:
  schedule:
    # Se ejecuta todos los días cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si se desea

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend y Base de Datos
        run: |
          curl -s -i "https://back-app-viajes.onrender.com/ping"
